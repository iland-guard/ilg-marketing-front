name: Deploy React to S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          MOBILE_APP_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.MOBILE_APP_ANDROID_SHA256_CERT_FINGERPRINTS }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_REGION }}

      - name: Deploy dist to S3
        run: aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # S3 cannot infer the correct MIME type for extensionless association/landing files.
      - name: Set app-link content types
        env:
          APP_LINKS_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 cp ./dist/.well-known/apple-app-site-association "s3://$APP_LINKS_BUCKET/.well-known/apple-app-site-association" --content-type application/json --cache-control "public,max-age=3600"
          aws s3 cp ./dist/.well-known/assetlinks.json "s3://$APP_LINKS_BUCKET/.well-known/assetlinks.json" --content-type application/json --cache-control "public,max-age=3600"
          aws s3 cp ./dist/app/whatsapp/verified "s3://$APP_LINKS_BUCKET/app/whatsapp/verified" --content-type "text/html; charset=utf-8" --cache-control no-store

      - name: Invalidate CloudFront Cache
        env:
          # Primary + secondary distributions
          CLOUDFRONT_DISTRIBUTION_IDS: E3TLVG5CTFPRKN EKAR1KW5LY2S0
        run: |
          for DIST_ID in $CLOUDFRONT_DISTRIBUTION_IDS; do
            echo "Invalidating CloudFront distribution: $DIST_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
          done
